name: kernelCTF PR check
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths: [pocs/linux/kernelctf/**]
  workflow_call:
    inputs:
      prNumber:
        description: 'PR number'
        type: number
      shaHash:
        description: 'SHA hash'
        type: string
      baseSha:
        description: 'Base SHA for fork-side CI testing'
        type: string
      skipRepro:
        description: 'Skip reproduction'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      prNumber:
        description: 'PR number'
        type: number
      shaHash:
        description: 'SHA hash'
      baseSha:
        description: 'Base SHA for fork-side CI testing'
      skipRepro:
        description: 'Skip reproduction'
        type: boolean
        required: false
        default: false
permissions: {}
env:
  PR_REF: ${{ contains(github.event_name, 'workflow_') && (inputs.shaHash || format('refs/pull/{0}/merge', inputs.prNumber)) || github.event.pull_request.head.sha }}
jobs:
  structure_check:
    # if labeling triggered the job then only run in case of the "recheck" label
    if: github.repository == 'google/security-research' && (github.event.action != 'labeled' || github.event.label.name == 'recheck')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      targets: ${{ steps.check_submission.outputs.targets }}
      submission_dir: ${{ steps.check_submission.outputs.submission_dir }}
      exploits_info: ${{ steps.check_submission.outputs.exploits_info }}
      artifact_backup_dir: ${{ steps.check_submission.outputs.artifact_backup_dir }}
    steps:
      - run: pip install -U jsonschema

      - name: Checkout repo content (sparse - only check-submission.py)
        uses: actions/checkout@v6
        with:
          repository: google/security-research
          ref: master
          sparse-checkout: |
            kernelctf/check-submission.py
            kernelctf/utils.py
          sparse-checkout-cone-mode: false

      - name: Checkout PR content (full)
        uses: actions/checkout@v6
        with:
          path: pr-content
          ref: ${{ env.PR_REF }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - id: check_submission
        name: Check submission
        working-directory: pr-content
        run: |
          echo "::stop-commands::$(uuidgen)"
          ../kernelctf/check-submission.py ${{ contains(github.event_name, 'workflow_') && inputs.baseSha || github.event.pull_request.base.sha }}

  exploit_build:
    runs-on: ubuntu-latest
    needs: structure_check
    permissions: {}
    strategy:
      matrix:
        target: ${{ fromJSON(needs.structure_check.outputs.targets) }}
      fail-fast: false # do not cancel other targets
    env:
      RELEASE_ID: ${{ matrix.target }}
      EXPLOIT_DIR: pocs/linux/kernelctf/${{ needs.structure_check.outputs.submission_dir }}/exploit/${{ matrix.target }}
      SUBMISSION_DIR: ${{ needs.structure_check.outputs.submission_dir }}
    steps:
      - name: Checkout PR content (full)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PR_REF }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Checkout Android scripts (sparse) - Android only
        if: startsWith(matrix.target, 'android')
        uses: actions/checkout@v6
        with:
          path: scripts-from-master
          ref: master
          sparse-checkout: |
            kernelctf/server/get_android_dependencies.sh
          sparse-checkout-cone-mode: false

      - name: List files
        run: find .

      - name: Backup original exploit
        run: mv $EXPLOIT_DIR/exploit ./

      - name: Install Android dependencies (exploit-build-only mode)
        if: startsWith(matrix.target, 'android')
        run: |
          bash scripts-from-master/kernelctf/server/get_android_dependencies.sh --exploit-build-only

      - name: Install kernelXDK (Linux only)
        if: startsWith(matrix.target, 'android') == false
        run: |
          sudo apt install libkeyutils-dev
          wget https://github.com/google/kernel-research/releases/download/libxdk%2Fv0.1/libxdk-v0.1.tar.gz
          tar -xzvf libxdk-v0.1.tar.gz
          chmod -R o+rx include lib
          sudo cp -R include/* /usr/local/include/
          sudo cp -R lib/* /usr/lib/

      - name: Build exploit
        id: build_exploit
        working-directory: ${{ env.EXPLOIT_DIR }}
        run: |
          if make -n prerequisites; then
            make prerequisites
          fi
          make exploit

      - name: Upload exploit (newly compiled)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.structure_check.outputs.artifact_backup_dir }}_exploit_${{ env.RELEASE_ID }}
          path: ${{ env.EXPLOIT_DIR }}/exploit
          if-no-files-found: error

      - name: Upload exploit (original, build failed)
        if: failure() && steps.build_exploit.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.structure_check.outputs.artifact_backup_dir }}_exploit_${{ env.RELEASE_ID }}
          path: ./exploit
          if-no-files-found: error

      - name: Summarize result (success)
        if: success()
        run: printf '✅ Exploit was built successfully.\n\nIt can be found under the artifacts (`exploit_${{ env.RELEASE_ID }}`).\n' >> $GITHUB_STEP_SUMMARY

      - name: Summarize result (failure)
        if: failure() && steps.build_exploit.outcome == 'failure'
        run: printf '❌ The exploit compilation failed.\n\nPlease fix it.\n\nYou can see the build logs by clicking on `...` here and then on "View job logs". Or by selecting `exploit_build (${{ env.RELEASE_ID }})` under Jobs in the left menubar.\n' >> $GITHUB_STEP_SUMMARY

  exploit_build_debug:
    runs-on: ubuntu-latest
    needs: structure_check
    permissions: {}
    strategy:
      matrix:
        target: ${{ fromJSON(needs.structure_check.outputs.targets) }}
      fail-fast: false # do not cancel other targets
    env:
      RELEASE_ID: ${{ matrix.target }}
      EXPLOIT_DIR: pocs/linux/kernelctf/${{ needs.structure_check.outputs.submission_dir }}/exploit/${{ matrix.target }}
      SUBMISSION_DIR: ${{ needs.structure_check.outputs.submission_dir }}
    steps:
      - name: Checkout PR content (full)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PR_REF }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Checkout Android scripts (sparse) - Android only
        if: startsWith(matrix.target, 'android')
        uses: actions/checkout@v6
        with:
          path: scripts-from-master
          ref: master
          sparse-checkout: |
            kernelctf/server/get_android_dependencies.sh
          sparse-checkout-cone-mode: false

      - name: Install Android dependencies (exploit-build-only mode)
        if: startsWith(matrix.target, 'android')
        run: |
          bash scripts-from-master/kernelctf/server/get_android_dependencies.sh --exploit-build-only

      - name: Install kernelXDK (Linux only)
        if: startsWith(matrix.target, 'android') == false
        run: |
          sudo apt install libkeyutils-dev
          wget https://github.com/google/kernel-research/releases/download/libxdk%2Fv0.1/libxdk-v0.1.tar.gz
          tar -xzvf libxdk-v0.1.tar.gz
          chmod -R o+rx include lib
          sudo cp -R include/* /usr/local/include/
          sudo cp -R lib/* /usr/lib/

      - name: Convert exploit to debug build
        working-directory: ${{ env.EXPLOIT_DIR }}
        run: |
          # Add -g flag to any gcc, g++ or clang variant (including x86_64-linux-android21-clang)
          sed -i -E 's/([a-zA-Z0-9_-]*)(gcc|g\+\+|clang)(\s)/\1\2 -g\3/g' Makefile
          sed -i '/configure --enable-debug/!s/configure/configure --enable-debug/g' Makefile
          sed -i 's/-o exploit\b/-o exploit_debug/g' Makefile
          sed -i 's/ -s\b//g' Makefile
          sed -i 's/exploit:/exploit_debug:/g' Makefile
          sed -i 's/all: exploit$/all: exploit_debug/g' Makefile

      - name: Build exploit
        working-directory: ${{ env.EXPLOIT_DIR }}
        run: |
          if make -n prerequisites; then
            make prerequisites
          fi
          make exploit_debug
          file exploit_debug | grep debug_info

      - name: Upload debug build
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.structure_check.outputs.artifact_backup_dir }}_exploit_debug_${{ env.RELEASE_ID }}
          path: ${{ env.EXPLOIT_DIR }}/exploit_debug
          if-no-files-found: error

  exploit_repro:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: {}
    needs: [structure_check, exploit_build]
    strategy:
      matrix:
        target: ${{ fromJSON(needs.structure_check.outputs.targets) }}
      fail-fast: false
    if: always() && needs.structure_check.result == 'success' && !inputs.skipRepro
    env:
      RELEASE_ID: ${{ matrix.target }}
      SUBMISSION_DIR: ${{ needs.structure_check.outputs.submission_dir }}
      EXPLOIT_INFO: ${{ toJSON(fromJSON(needs.structure_check.outputs.exploits_info)[matrix.target]) }}
    defaults:
      run:
        shell: bash
        working-directory: ./kernelctf/repro
    steps:
      - name: Checkout repo content (sparse - repro and server only)
        uses: actions/checkout@v6
        with:
          repository: google/security-research
          ref: master
          sparse-checkout: |
            kernelctf
          sparse-checkout-cone-mode: true

      - name: Download exploit
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.structure_check.outputs.artifact_backup_dir }}_exploit_${{ env.RELEASE_ID }}
          path: ./kernelctf/repro/exp/

      - name: Make exploit executable
        run: chmod +x ./exp/exploit

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install tools (QEMU, inotify, expect) - Linux only
        if: startsWith(matrix.target, 'android') == false
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 inotify-tools expect

      - name: Fetch rootfs - Linux only
        if: startsWith(matrix.target, 'android') == false
        run: |
          wget -O rootfs.img.gz https://storage.googleapis.com/kernelctf-build/files/rootfs_repro_v2.img.gz
          gzip -d rootfs.img.gz

      - name: Download bzImage - Linux only
        if: startsWith(matrix.target, 'android') == false
        run: |
          if [ "$RELEASE_ID" == "mitigation-6.1" ]; then RELEASE_ID="mitigation-6.1-v2"; fi
          wget https://storage.googleapis.com/kernelctf-build/releases/$RELEASE_ID/bzImage

      - name: Load optional kernel modules for Cuttlefish - Android only
        if: startsWith(matrix.target, 'android')
        run: |
          sudo modprobe vhost_net
          sudo modprobe vhost_vsock

      - name: Install Android dependencies and download system images (parallel) - Android only
        if: startsWith(matrix.target, 'android')
        run: bash ../.github/scripts/install_android_deps.sh

      - name: Set paths - Android only
        if: startsWith(matrix.target, 'android')
        run: |
          # Use the APK we saved during cleanup
          APK_PATH="$(realpath ./apk/app-release.apk)"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "[INFO] APK path set to: $APK_PATH"
          echo "ANDROID_RELEASE_PATH=$(realpath android_release)" >> $GITHUB_ENV

      - id: repro1
        name: Reproduction (1 / 10)
        continue-on-error: true
        run: ./repro.sh 1

      - id: repro2
        name: Reproduction (2 / 10)
        continue-on-error: true
        run: ./repro.sh 2

      - id: repro3
        name: Reproduction (3 / 10)
        continue-on-error: true
        run: ./repro.sh 3

      - id: repro4
        name: Reproduction (4 / 10)
        continue-on-error: true
        run: ./repro.sh 4

      - id: repro5
        name: Reproduction (5 / 10)
        continue-on-error: true
        run: ./repro.sh 5

      - id: repro6
        name: Reproduction (6 / 10)
        continue-on-error: true
        run: ./repro.sh 6

      - id: repro7
        name: Reproduction (7 / 10)
        continue-on-error: true
        run: ./repro.sh 7

      - id: repro8
        name: Reproduction (8 / 10)
        continue-on-error: true
        run: ./repro.sh 8

      - id: repro9
        name: Reproduction (9 / 10)
        continue-on-error: true
        run: ./repro.sh 9

      - id: repro10
        name: Reproduction (10 / 10)
        continue-on-error: true
        run: ./repro.sh 10

      - name: Upload repro logs as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.structure_check.outputs.artifact_backup_dir }}_repro_logs_${{ env.RELEASE_ID }}
          path: ./kernelctf/repro/repro_log_*.txt

      - name: Reproduction // Summary
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo $STEPS >> steps.json
          ../repro_summary.py ${{ github.run_id }}

      - name: Upload repro summary as an artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.structure_check.outputs.artifact_backup_dir }}_repro_summary_${{ env.RELEASE_ID }}
          path: ./kernelctf/repro/repro_summary.md

  vuln_verify:
    if: github.repository == 'google/security-research'
    uses: ./.github/workflows/kernelctf-vuln-verify.yaml
    needs: structure_check
    secrets: inherit
    with:
      prNumber: ${{ contains(github.event_name, 'workflow_') && inputs.prNumber || github.event.pull_request.number }}

  fork_vuln_verify:
    if: github.repository != 'google/security-research' && inputs.skipRepro
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IMAGE_RUNNER_DIR: ${{ github.workspace }}/kernel-research/image_runner
    steps:
      - name: Checkout Google verification scripts
        uses: actions/checkout@v6
        with:
          repository: google/security-research
          ref: master
          sparse-checkout: kernelctf/vuln-verify

      - name: Checkout candidate submission
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PR_REF }}
          path: pr
          sparse-checkout: pocs/linux/kernelctf/CVE-2026-64560_lts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Checkout kernel image runner
        uses: actions/checkout@v6
        with:
          repository: google/kernel-research
          path: kernel-research
          sparse-checkout: image_runner

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/share/swift /usr/local/share/boost /usr/local/lib/android

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect build-essential flex bison bc libelf-dev libssl-dev cpio pahole qemu-system-x86
          pip install requests

      - name: Restore fork-built KASAN kernels
        id: kasan-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            kernelctf/vuln-verify/builds/cve64560_before_bzImage
            kernelctf/vuln-verify/builds/cve64560_after_bzImage
          key: cve-2026-64560-stable-kasan-720e8bc-e74443f-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build stable KASAN pair from public sources
        working-directory: kernelctf/vuln-verify
        run: |
          mkdir -p builds
          wget -qO builds/lts-6.12.89.config \
            https://storage.googleapis.com/kernelctf-build/releases/lts-6.12.89/.config
          if [ ! -f builds/cve64560_before_bzImage ]; then
            ./build_release.sh https://github.com/gregkh/linux \
              720e8bcaa674dfa40b989207d6cdb44b3aaa8db6 \
              builds/lts-6.12.89.config kasan.config
            cp linux/arch/x86/boot/bzImage builds/cve64560_before_bzImage
          fi
          if [ ! -f builds/cve64560_after_bzImage ]; then
            ./build_release.sh https://github.com/gregkh/linux \
              e74443f5db0037c556ef436fa64b88bf4ea08f83 \
              builds/lts-6.12.89.config kasan.config
            cp linux/arch/x86/boot/bzImage builds/cve64560_after_bzImage
          fi
          sha256sum builds/cve64560_before_bzImage builds/cve64560_after_bzImage

      - name: Save fork-built KASAN kernels
        if: steps.kasan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            kernelctf/vuln-verify/builds/cve64560_before_bzImage
            kernelctf/vuln-verify/builds/cve64560_after_bzImage
          key: ${{ steps.kasan-cache.outputs.cache-primary-key }}

      - name: Run exact KASAN positive and negative tests
        working-directory: kernelctf/vuln-verify
        run: |
          cp -a rootfs/. "$IMAGE_RUNNER_DIR/rootfs/"
          cp "${{ github.workspace }}/pr/pocs/linux/kernelctf/CVE-2026-64560_lts/exploit/lts-6.12.89/exploit" \
            "$IMAGE_RUNNER_DIR/rootfs/exp"
          chmod +x "$IMAGE_RUNNER_DIR/rootfs/exp"

          set +e
          timeout 3m "$IMAGE_RUNNER_DIR/run_vmlinuz.sh" \
            builds/cve64560_before_bzImage \
            --kernel-args=kasan.fault=panic --nokaslr -- /exp.sh --vuln-trigger \
            2>&1 | tee builds/cve64560_before_run.log
          set -e
          grep -q 'KASAN:' builds/cve64560_before_run.log

          set +e
          timeout 3m "$IMAGE_RUNNER_DIR/run_vmlinuz.sh" \
            builds/cve64560_after_bzImage \
            --kernel-args=kasan.fault=panic --nokaslr -- /exp.sh --vuln-trigger \
            2>&1 | tee builds/cve64560_after_run.log
          after_rc=${PIPESTATUS[0]}
          set -e
          if grep -Eq 'KASAN:|Kernel panic|WARNING:.*posix_cpu_timer' \
            builds/cve64560_after_run.log; then
            exit 1
          fi
          test "$after_rc" -eq 124

  fork_exploit_repro:
    if: github.repository != 'google/security-research' && inputs.skipRepro == false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      RELEASE_ID: lts-6.12.89
      EXPLOIT_INFO: >-
        {"uses":[],"requires_separate_kaslr_leak":false,"flag_time":"2026-06-05T19:53:29.658Z"}
    defaults:
      run:
        shell: bash
        working-directory: ./kernelctf/repro
    steps:
      - name: Checkout Google reproduction scripts
        uses: actions/checkout@v6
        with:
          repository: google/security-research
          ref: master
          sparse-checkout: kernelctf

      - name: Checkout candidate submission
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PR_REF }}
          path: pr
          sparse-checkout: pocs/linux/kernelctf/CVE-2026-64560_lts
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Install build and reproduction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkeyutils-dev qemu-system-x86 inotify-tools expect

      - name: Build candidate exploit
        working-directory: pr/pocs/linux/kernelctf/CVE-2026-64560_lts/exploit/lts-6.12.89
        run: |
          make clean
          make -j2 exploit

      - name: Install candidate exploit
        run: |
          mkdir -p exp
          cp "${{ github.workspace }}/pr/pocs/linux/kernelctf/CVE-2026-64560_lts/exploit/lts-6.12.89/exploit" exp/exploit
          chmod +x exp/exploit

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch official rootfs and bzImage
        run: |
          wget -qO rootfs.img.gz https://storage.googleapis.com/kernelctf-build/files/rootfs_repro_v2.img.gz
          gzip -d rootfs.img.gz
          wget -qO bzImage https://storage.googleapis.com/kernelctf-build/releases/lts-6.12.89/bzImage

      - id: repro1
        name: Reproduction (1 / 10)
        continue-on-error: true
        run: ./repro.sh 1

      - id: repro2
        name: Reproduction (2 / 10)
        continue-on-error: true
        run: ./repro.sh 2

      - id: repro3
        name: Reproduction (3 / 10)
        continue-on-error: true
        run: ./repro.sh 3

      - id: repro4
        name: Reproduction (4 / 10)
        continue-on-error: true
        run: ./repro.sh 4

      - id: repro5
        name: Reproduction (5 / 10)
        continue-on-error: true
        run: ./repro.sh 5

      - id: repro6
        name: Reproduction (6 / 10)
        continue-on-error: true
        run: ./repro.sh 6

      - id: repro7
        name: Reproduction (7 / 10)
        continue-on-error: true
        run: ./repro.sh 7

      - id: repro8
        name: Reproduction (8 / 10)
        continue-on-error: true
        run: ./repro.sh 8

      - id: repro9
        name: Reproduction (9 / 10)
        continue-on-error: true
        run: ./repro.sh 9

      - id: repro10
        name: Reproduction (10 / 10)
        continue-on-error: true
        run: ./repro.sh 10

      - name: Reproduction summary and 90% gate
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          echo "$STEPS" > steps.json
          ../repro_summary.py ${{ github.run_id }}
          success_count=$(jq '[to_entries[] | select(.key | startswith("repro")) | select(.value.outcome == "success")] | length' steps.json)
          test "$success_count" -ge 9

      - name: Upload reproduction logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cve-2026-64560-fork-repro-${{ github.run_id }}
          path: |
            kernelctf/repro/repro_log_*.txt
            kernelctf/repro/repro_summary.md

  backup_artifacts:
    runs-on: ubuntu-latest
    needs: [structure_check, exploit_build, exploit_build_debug, exploit_repro]
    if: always() && needs.structure_check.result == 'success' && github.event_name != 'workflow_call' && github.repository == 'google/security-research'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{secrets.KERNELCTF_GCS_SA_KEY}}'

      - name: Upload artifacts to GCS
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: ./artifacts
          destination: kernelctf-build/artifacts/${{ needs.structure_check.outputs.artifact_backup_dir }}_${{ github.run_id }}
          parent: false
          predefinedAcl: publicRead
          process_gcloudignore: false # removes warnings that .gcloudignore file does not exist
